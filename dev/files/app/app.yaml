command:
  - streamlit
  - run
  - app.py

env:
  - name: STREAMLIT_GATHER_USAGE_STATS
    value: "false"

  - name: DEV_E2E_JOB_ID
    valueFrom: dev-e2e-job

  - name: STAGING_E2E_JOB_ID
    valueFrom: staging-e2e-job

  - name: PROD_E2E_JOB_ID
    valueFrom: prod-e2e-job

  - name: DEV_QA_JOB_ID
    valueFrom: dev-qa-job

  - name: STAGING_QA_JOB_ID
    valueFrom: staging-qa-job

  - name: PROD_QA_JOB_ID
    valueFrom: prod-qa-job

  # SQL warehouse used for dashboards, the data explorer and the AI assistant
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

  # Chat model (with tool calling) behind the "Ask AI" page
  - name: SERVING_ENDPOINT_NAME
    valueFrom: serving-endpoint

  - name: DEFAULT_ENVIRONMENT
    value: "PROD"

  # Genie Agents behind Ask AI's "Genie" engine (definition: genie/genie_space_prod.json).
  # DEV/STAGING have no agent yet, so Ask AI uses gpt-oss there.
  - name: PROD_GENIE_SPACE_ID
    value: "01f1c0ace0ad1b2cbce08a2b45b1b417"

  # Viewers limited to these catalogs inside the app: "email=cat1,cat2;email2=cat3".
  # Unity Catalog grants are the real boundary — this also hides catalogs they could merely browse.
  - name: CATALOG_RESTRICTIONS
    value: ""
